name: CI-CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_staging:
        description: "Run staging deploy after successful checks"
        required: true
        default: false
        type: boolean

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check app tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tg_booking
          POSTGRES_USER: tg_booking
          POSTGRES_PASSWORD: tg_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_booking -d tg_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: ci
      LOG_LEVEL: INFO
      TELEGRAM_BOT_TOKEN: test_token
      TELEGRAM_MANAGER_CHAT_IDS: ""
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: tg_booking
      POSTGRES_USER: tg_booking
      POSTGRES_PASSWORD: tg_booking
      REDIS_URL: redis://127.0.0.1:6379/0
      TIMEZONE: Europe/Minsk
      SLOT_BUFFER_MIN: 10
      API_HOST: 0.0.0.0
      API_PORT: 8000
      BOT_POLLING_TIMEOUT: 30
      WORKER_POLL_INTERVAL: 30
      TEST_DATABASE_URL: postgresql+asyncpg://tg_booking:tg_booking@127.0.0.1:5432/tg_booking
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -f docker/Dockerfile -t tg-booking-bot:${{ github.sha }} .

  deploy_staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy_to_staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            export PROJECT_DIR=${{ secrets.STAGING_PROJECT_DIR }}
            export DEPLOY_REF=main
            export HEALTHCHECK_URL=${{ secrets.STAGING_HEALTHCHECK_URL }}
            bash "$PROJECT_DIR/scripts/deploy_staging.sh"

      - name: Rollback on deploy failure
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            export PROJECT_DIR=${{ secrets.STAGING_PROJECT_DIR }}
            export HEALTHCHECK_URL=${{ secrets.STAGING_HEALTHCHECK_URL }}
            bash "$PROJECT_DIR/scripts/rollback_staging.sh"

      - name: Fail job when deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
