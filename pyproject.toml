[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-booking-bot"
version = "0.1.0"
description = "Telegram booking bot MVP with FastAPI, aiogram, PostgreSQL, and Redis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "aiogram>=3.7.0,<4.0.0",
  "alembic>=1.13.2,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic-settings>=2.3.4,<3.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "redis>=5.0.7,<6.0.0",
  "sqlalchemy[asyncio]>=2.0.31,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0",
  "ruff>=0.5.5,<1.0.0"
]

[project.scripts]
api = "app.api.main:run"
bot = "app.bot.main:run"
worker = "app.worker.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
